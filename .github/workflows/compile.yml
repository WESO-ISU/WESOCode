
name: Compile Arduino Sketch

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: arduino/compile-sketches@v1
        with:
          sketch-paths: |
            ./WESO26_Code
          verbose: true
          enable-warnings-report: true
